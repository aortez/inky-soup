apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// The shared app version in app/package.json is the single source of truth for Android releases.
// Each MAJOR.MINOR.PATCH part is limited to 999 so version codes stay monotonic.
def frameVersion = new JsonSlurper().parse(file('../../package.json')).version
def frameVersionParts = (frameVersion =~ /^(\d{1,3})\.(\d{1,3})\.(\d{1,3})$/)
if (!frameVersionParts.matches()) throw new GradleException("app/package.json version must be MAJOR.MINOR.PATCH with parts up to 999: ${frameVersion}")
def frameVersionCode = frameVersionParts[0][1].toInteger() * 1000000 + frameVersionParts[0][2].toInteger() * 1000 + frameVersionParts[0][3].toInteger()
// Release signing comes from the environment only; see docs/android-release.md.
def releaseKeystore = System.getenv('FRAME_RELEASE_KEYSTORE')

android {
    namespace = "pizza.allan.frame"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pizza.allan.frame"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode frameVersionCode
        versionName frameVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('FRAME_RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FRAME_RELEASE_KEY_ALIAS') ?: 'frame'
                keyPassword System.getenv('FRAME_RELEASE_KEY_PASSWORD') ?: System.getenv('FRAME_RELEASE_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Without the release keystore variables the APK stays unsigned and Android refuses to install it.
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    // Local unit tests need a real JSON parser in place of the android.jar stubs.
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
