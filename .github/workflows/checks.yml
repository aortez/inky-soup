name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: upload-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: upload-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  rust:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: upload-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
      - name: Install the image's Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked

  cli:
    name: Local Rust CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the host CLI toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt
      - run: cargo +1.94.1 fmt --manifest-path cli/Cargo.toml --check
      - run: cargo +1.94.1 test --locked --manifest-path cli/Cargo.toml

  display:
    name: Display image decoding
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m venv /tmp/inky-display-tests
      - run: /tmp/inky-display-tests/bin/pip install Pillow==12.1.1 numpy==2.3.5
      - run: /tmp/inky-display-tests/bin/python -m unittest discover -s tests -v

  usb:
    name: USB scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 yocto/scripts/test_usb_gadget.py
      - name: Check gadget shell scripts
        run: |
          shellcheck yocto/meta-inky-soup/recipes-connectivity/inky-soup-usb-gadget/files/inky-soup-usb-gadget \
            yocto/meta-inky-soup/recipes-connectivity/inky-soup-usb-gadget/files/inky-soup-usb-recover

  provisioning:
    name: Bluetooth recovery provisioning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install the image's Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Verify the packaged provisioner matches the tested source
        run: python3 yocto/scripts/check_provisioner_source.py
      - run: cargo +1.85.0 test --locked --manifest-path yocto/pi-base/wifi-provisioner/Cargo.toml
